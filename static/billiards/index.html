<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8球 · 腾讯桌球风格</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <div id="hud">
    <div class="player-card" id="cardP1">
      <div class="avatar p1">你</div>
      <div class="info">
        <div class="pname">玩家</div>
        <div class="ptype" id="typeP1">未定球</div>
      </div>
      <div class="ballrow" id="rowP1"></div>
    </div>

    <div class="center-panel">
      <div class="msg" id="msg">按 空格 开球</div>
      <div class="hint" id="hint">鼠标瞄准 · 滚轮微调 · 按住蓄力 · 松开击球</div>
    </div>

    <div class="player-card right" id="cardP2">
      <div class="ballrow" id="rowP2"></div>
      <div class="info">
        <div class="pname">电脑</div>
        <div class="ptype" id="typeP2">未定球</div>
      </div>
      <div class="avatar p2">AI</div>
    </div>
  </div>

  <div id="stage">
    <canvas id="table"></canvas>

    <div id="pathPanel" class="hidden">
      <div class="pp-row">
        <span class="pp-dot"></span>
        <span class="pp-title">路径绘制</span>
        <span class="pp-steps">
          <span class="pp-step" id="ppStepCue">① 白球</span>
          <span class="pp-step" id="ppStepObj">② 目标球</span>
        </span>
        <span class="pp-actions">
          <button id="ppOk" class="pp-btn primary" disabled>确认</button>
          <button id="ppRedraw" class="pp-btn" disabled>重画</button>
          <button id="ppCancel" class="pp-btn" disabled>取消</button>
        </span>
      </div>
      <div class="pp-hint" id="ppHint">从白球上按住开始拖，先画白球怎么走</div>
    </div>
  </div>

  <div id="bottom">
    <div class="power-wrap">
      <div class="power-label">力度</div>
      <div class="power-bar"><div class="power-fill" id="powerFill"></div></div>
      <div class="power-val" id="powerVal">0%</div>
    </div>

    <div class="spin-wrap">
      <div class="spin-label">击球点</div>
      <canvas id="spin" width="120" height="120"></canvas>
      <div class="spin-note">拖红点加塞 · 双击回中</div>
    </div>

    <div class="ctrl">
      <button id="btnSound" class="btn">音效 开</button>
      <button id="btnAim" class="btn">辅助线 开</button>
      <button id="btnLevel" class="btn">难度 普通</button>
      <button id="btnRestart" class="btn primary">重新开局</button>
    </div>
  </div>

  <div id="cueSelect">
    <div class="cue-tip">球杆（力度 · 准线）</div>
    <div class="cue-cards" id="cueCards"></div>
  </div>

  <div id="tableSelect">
    <div class="cue-tip">球桌（台呢 · 木框）</div>
    <div class="table-cards" id="tableCards"></div>
  </div>

  <div class="back-home"><a href="../index.html">&larr; 返回博客</a></div>
</div>

<div id="overlay" class="hidden">
  <div class="dialog">
    <h2 id="ovTitle">胜利</h2>
    <p id="ovText">你赢了</p>
    <button id="ovBtn" class="btn primary">再来一局</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/audio.js"></script>
<script src="js/physics.js"></script>
<script src="js/aim.js"></script>
<script src="js/render.js"></script>
<script src="js/rules.js"></script>
<script src="js/ai.js"></script>
<script src="js/pathdraw.js"></script>
<script src="js/skins.js"></script>
<script src="js/game.js"></script>
</body>
</html>
