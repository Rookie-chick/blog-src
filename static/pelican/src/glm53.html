<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>鹈鹕骑行 · Pelican Ride</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;

  h1 small { font-size: 14px; color: #8a93a0; font-weight: normal; margin-left: 10px; }
  .card {
    width: min(920px, 96vw);
    border-radius: 18px; overflow: hidden;
    box-shadow: 0 18px 50px rgba(60, 80, 110, .22);
    background: #fff;
  }
  svg { display: block; width: 100%; height: auto; }
  p.tip { font-size: 13px; color: #98a1ad; }
</style>
</head>
<body>

<h1>🚴 鹈鹕骑行 <small>Pelican Ride · 纯 SVG 动画，腿部为实时 IK 驱动</small></h1>

<div class="card">

        <line x1="0" y1="0" x2="-34" y2="0" stroke="#3a3f47" stroke-width="7" stroke-linecap="round"/>
        <g transform="translate(34,0)"><g id="pedal1">
          <rect x="-12" y="-4" width="24" height="8" rx="2.5" fill="#23272e"/>
        </g></g>
        <g transform="translate(-34,0)"><g id="pedal2">
          <rect x="-12" y="-4" width="24" height="8" rx="2.5" fill="#23272e"/>
        </g></g>
      </g>
      <circle r="7" fill="#23272e"/>
    </g>

    <!-- ===== 近侧腿（画在曲柄之上、身体之下） ===== -->

      <g id="thighN">
        <rect x="-9" y="-7" width="81" height="14" rx="7" fill="#f5a64a"/>
        <g id="kneeN">
          <rect x="-7" y="-6" width="79" height="12" rx="6" fill="#f5a64a"/>
          <g id="footN">

      <!-- 身体 -->
      <ellipse cx="330" cy="185" rx="58" ry="42" fill="#f7f9fb" stroke="#d8dee6" stroke-width="1.5" transform="rotate(-8 330 185)"/>

      <path d="M358,172 C382,150 390,120 420,98" stroke="#d8dee6" stroke-width="29" stroke-linecap="round" fill="none"/>
      <path d="M358,172 C382,150 390,120 420,98" stroke="#f7f9fb" stroke-width="24" stroke-linecap="round" fill="none"/>

<p class="tip">轮辐 / 太阳 / 云 / 围巾 / 喉囊 —— SMIL 动画 · 曲柄 / 双腿 / 脚蹼 —— JS 实时两连杆 IK，脚永远踩在踏板上</p>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const crankRot = $('crankRot'), pedal1 = $('pedal1'), pedal2 = $('pedal2');
  const bird = $('bird');
  const legs = {
    N: { root: $('legN'), thigh: $('thighN'), knee: $('kneeN'), foot: $('footN'), phase: 0 },
    F: { root: $('legF'), thigh: $('thighF'), knee: $('kneeF'), foot: $('footF'), phase: 180 }
  };

  // ---- 几何常量（与画面坐标一致）----
  const B = { x: 360, y: 338 };   // 曲柄轴（五通）
  const R = 34;                   // 曲柄长
  const HIP = { x: 320, y: 240 }; // 髋关节
  const L1 = 72, L2 = 72;         // 大腿 / 小腿长
  const PERIOD = 0.95;            // 曲柄周期（秒）
  const DEG = 180 / Math.PI;

  // 两连杆 IK：给定踏板位置，求 大腿角 / 小腿相对角 / 脚掌补偿角
  function solveLeg(leg, thetaDeg, bob) {
    const th = thetaDeg * Math.PI / 180;
    const px = B.x + R * Math.cos(th);
    const py = B.y + R * Math.sin(th);
    const hx = HIP.x, hy = HIP.y + bob;

    let dx = px - hx, dy = py - hy;
    let d = Math.hypot(dx, dy);
    d = Math.min(Math.max(d, 12), L1 + L2 - 1);   // 域保护

    const alpha = Math.atan2(dy, dx);
    let cosB = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
    cosB = Math.min(Math.max(cosB, -1), 1);
    const beta = Math.acos(cosB);

    const phi1 = alpha - beta;                     // 大腿角（膝朝前上）
    const kx = hx + L1 * Math.cos(phi1);
    const ky = hy + L1 * Math.sin(phi1);
    const phi2abs = Math.atan2(py - ky, px - kx);  // 小腿绝对角
    const phi2rel = phi2abs - phi1;                // 小腿相对角

    leg.root.setAttribute('transform', `translate(${hx.toFixed(2)} ${(hy).toFixed(2)})`);
    leg.thigh.setAttribute('transform', `rotate(${(phi1 * DEG).toFixed(2)})`);
    leg.knee.setAttribute('transform', `translate(${L1} 0) rotate(${(phi2rel * DEG).toFixed(2)})`);
    leg.foot.setAttribute('transform', `translate(${L2} 0) rotate(${(-(phi1 + phi2rel) * DEG).toFixed(2)})`); // 脚掌保持水平
  }

  let t0 = null;
  function frame(now) {
    if (t0 === null) t0 = now;
    const t = (now - t0) / 1000;
    const theta = (t / PERIOD) * 360;

    // 曲柄 + 踏板反向自转（保持水平）
    crankRot.setAttribute('transform', `rotate(${(theta % 360).toFixed(2)})`);
    pedal1.setAttribute('transform', `rotate(${(-theta % 360).toFixed(2)})`);
    pedal2.setAttribute('transform', `rotate(${(-theta % 360).toFixed(2)})`);

    // 车身颠簸：每圈两次轻微起伏
    const bob = Math.sin(2 * theta * Math.PI / 180) * 2.2;
    bird.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);

    solveLeg(legs.N, theta, bob);
    solveLeg(legs.F, theta + legs.F.phase, bob);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
