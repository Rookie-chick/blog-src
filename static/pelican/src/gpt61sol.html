<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f3e9">
  <title>鹈鹕，慢慢骑 · SVG 动画</title>
  <style>
    :root { color-scheme: light; --paper: #f6f3e9; --ink: #254d4b; --muted: #7b8c81; --accent: #df7552; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .page { max-width: 1400px; margin: auto; padding: 38px 54px 26px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 12px; font-weight: 600; letter-spacing: 2px; }
    .brand svg { width: 28px; height: 28px; }
    .edition { color: var(--muted); font-size: 11px; letter-spacing: 2px; }
    .intro { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin: 42px 0 26px; }
    .eyebrow { font-size: 10px; letter-spacing: 3px; color: var(--accent); margin: 0 0 12px; }
    h1 { margin: 0; font-family: "Microsoft YaHei", sans-serif; font-size: clamp(27px, 3.4vw, 43px); font-weight: 500; letter-spacing: 2px; }
    .description { margin: 13px 0 0; color: var(--muted); font-size: 13px; letter-spacing: 1px; line-height: 1.8; }
    .weather { display: flex; align-items: center; gap: 9px; padding-bottom: 5px; color: #768b80; font-size: 12px; white-space: nowrap; }
    .weather i { display: block; width: 7px; height: 7px; background: #8da891; border-radius: 50%; box-shadow: 0 0 0 4px #8da89115; }
    .stage { position: relative; border-radius: 24px; overflow: hidden; background: #e8efe7; isolation: isolate; }
    .scene { display: block; width: 100%; height: auto; aspect-ratio: 1200 / 710; }
    .scene-label { position: absolute; top: 25px; left: 29px; display: flex; align-items: center; gap: 10px; color: #5f807a; font-size: 10px; letter-spacing: 2px; pointer-events: none; }
    .scene-label::before { content: ""; width: 18px; height: 1px; background: #79988c; }
    .stamp { position: absolute; top: 24px; right: 27px; border: 1px solid #688a7936; border-radius: 50%; width: 65px; height: 65px; display: grid; place-content: center; text-align: center; color: #688a79; transform: rotate(10deg); font-size: 9px; letter-spacing: 1px; line-height: 1.7; }
    .stamp strong { font-family: Georgia, serif; font-size: 22px; font-weight: 400; }
    .controls { display: flex; align-items: center; justify-content: space-between; gap: 22px; padding: 21px 0; border-bottom: 1px solid #254d4b17; }
    .playback { display: flex; align-items: center; gap: 20px; }
    .play-button { display: flex; align-items: center; gap: 9px; border: 1px solid #254d4b26; background: transparent; color: var(--ink); border-radius: 100px; padding: 10px 17px; font-size: 12px; min-width: 108px; }
    .play-button:hover { background: #e7ebe1; }
    .play-button svg { width: 14px; height: 14px; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    .speed { display: flex; align-items: center; gap: 11px; color: var(--muted); font-size: 11px; }
    input[type="range"] { width: 94px; height: 4px; accent-color: #4d7c70; cursor: pointer; }
    output { width: 34px; color: var(--ink); font-variant-numeric: tabular-nums; }
    .caption { font-size: 11px; color: var(--muted); letter-spacing: 1px; }
    footer { display: flex; justify-content: space-between; gap: 20px; padding-top: 19px; color: #92a096; font-size: 10px; letter-spacing: 1.2px; }
    footer .quote { font-size: 11px; letter-spacing: 1px; }
    @media (max-width: 700px) {
      .page { padding: 23px 18px; }
      .intro { margin-top: 31px; }
      .edition, .weather, .caption { display: none; }
      .stage { border-radius: 16px; }
      .scene { aspect-ratio: 1.15; object-fit: cover; }
      .scene-label { left: 18px; top: 18px; font-size: 8px; }
      .stamp { width: 48px; height: 48px; top: 16px; right: 17px; font-size: 7px; }
      .stamp strong { font-size: 16px; }
      .playback { width: 100%; justify-content: space-between; gap: 10px; }
      footer { font-size: 8px; }
      footer .quote { font-size: 9px; }
    }
  </style>
</head>
<body>

  <script>
    (() => {
      'use strict';
      const byId = id => document.getElementById(id);
      const el = Object.fromEntries([
        'rear-wheel', 'front-wheel', 'pelican-body', 'front-leg-path', 'rear-leg-path',
        'leg-highlight', 'crank-front', 'crank-back', 'front-pedal', 'rear-pedal',
        'coast', 'road', 'waves', 'clouds', 'sailboat', 'birds', 'flower', 'shadow',
        'scarf-back', 'scarf-front', 'blink', 'toggle', 'play-icon', 'play-label', 'speed', 'speed-value'
      ].map(id => [id, byId(id)]));
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !reducedMotion.matches;
      let speed = 1, time = 0, last = null, frame = null;
      const tau = Math.PI * 2;
      const transform = (node, value) => node.setAttribute('transform', value);

      // 两节腿的几何解：脚始终落在水平踏板上，膝盖自然弯曲。
      function legPath(hipX, hipY, footX, footY) {
        const upper = 103, lower = 100;
        const dx = footX - hipX, dy = footY - hipY;
        const distance = Math.max(.001, Math.hypot(dx, dy));
        const ux = dx / distance, uy = dy / distance;
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const height = Math.sqrt(Math.max(0, upper * upper - along * along));
        const kneeX = hipX + along * ux + height * uy;
        const kneeY = hipY + along * uy - height * ux;
        return `M${hipX} ${hipY} L${kneeX} ${kneeY} L${footX} ${footY}`;
      }

      function draw() {
        const phase = time * tau * .64;
        const bob = Math.sin(phase * 2) * 2.4;
        // 车轮转动的角速度与道路位移一致；脚踏采用较低的传动转速。
        const travel = time * 122;
        const wheelAngle = travel / 102 * 180 / Math.PI;
        transform(el['rear-wheel'], `rotate(${wheelAngle})`);
        transform(el['front-wheel'], `rotate(${wheelAngle})`);
        transform(el['pelican-body'], `translate(0 ${bob})`);
        const front = { x: 590 + Math.cos(phase) * 36, y: 560 + Math.sin(phase) * 36 };
        const rear = { x: 590 - Math.cos(phase) * 36, y: 560 - Math.sin(phase) * 36 };
        const frontPath = legPath(563, 395 + bob, front.x, front.y - 9);
        el['front-leg-path'].setAttribute('d', frontPath);
        el['leg-highlight'].setAttribute('d', frontPath);
        el['rear-leg-path'].setAttribute('d', legPath(553, 392 + bob, rear.x, rear.y - 9));
        el['crank-front'].setAttribute('d', `M590 560L${front.x} ${front.y}`);
        el['crank-back'].setAttribute('d', `M590 560L${rear.x} ${rear.y}`);
        transform(el['front-pedal'], `translate(${front.x} ${front.y})`);
        transform(el['rear-pedal'], `translate(${rear.x} ${rear.y})`);
        transform(el.coast, `translate(${-travel % 1200} 0)`);
        transform(el.road, `translate(${-travel % 1200} 0)`);
        transform(el.waves, `translate(${-(travel * .18) % 1200} 0)`);
        transform(el.clouds, `translate(${-(travel * .07) % 1200} 0)`);
        transform(el.sailboat, `translate(${1200 - (time * 4 + 1200) % 1460} ${Math.sin(time * 1.2) * 1.1})`);
        transform(el.birds, `translate(${Math.sin(time * .2) * 25} ${Math.sin(time * 1.5) * 3})`);
        transform(el.flower, `translate(${1250 - (travel + 200) % 1400} 688)`);
        el.shadow.setAttribute('rx', 268 + Math.sin(phase * 2) * 2);
        const flutter = Math.sin(time * 5) * 7;
        const tip = Math.sin(time * 5 - 1.4) * 6;
        el['scarf-back'].setAttribute('d', `M578 271C538 ${257 + flutter} 511 ${290 - flutter} 465 ${265 + tip}L477 ${285 + tip}C514 ${310 - flutter} 545 ${274 + flutter} 580 291Z`);
        el['scarf-front'].setAttribute('d', `M580 275C536 ${267 - flutter} 516 ${310 + flutter} 467 ${300 + tip}L474 ${319 + tip}C519 ${331 + flutter} 548 ${292 - flutter} 582 292Z`);
        const blinkTime = time % 5.7;
        el.blink.setAttribute('opacity', blinkTime > 5.48 && blinkTime < 5.65 ? '1' : '0');
      }

      function tick(now) {
        if (!playing || document.hidden) { frame = null; last = null; return; }
        if (last !== null) time += Math.min((now - last) / 1000, .05) * speed;
        last = now;
        draw();
        frame = requestAnimationFrame(tick);
      }

      function syncPlayback() {
        el['play-label'].textContent = playing ? '暂停片刻' : '继续骑行';
        el.toggle.setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        el['play-icon'].innerHTML = playing
          ? '<path d="M4 3h3v10H4zm5 0h3v10H9z"/>'
          : '<path d="m5 2 9 6-9 6Z"/>';
        if (frame !== null) cancelAnimationFrame(frame);
        frame = null;
        last = null;
        if (playing && !document.hidden) frame = requestAnimationFrame(tick);
      }

      el.toggle.addEventListener('click', () => { playing = !playing; syncPlayback(); });
      el.speed.addEventListener('input', () => {
        speed = Number(el.speed.value);
        el['speed-value'].textContent = `${speed.toFixed(1)}×`;
      });
      document.addEventListener('visibilitychange', syncPlayback);
      reducedMotion.addEventListener('change', event => { playing = !event.matches; syncPlayback(); });
      draw();
      syncPlayback();
    })();
  </script>
</body>
</html>
