<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f3e9">
  <title>鹈鹕的慢骑日 · Pelican on a Bicycle</title>
  <style>
    :root { color-scheme: light; --paper:#f6f3e9; --ink:#293f3a; --muted:#79877b; --orange:#e77645; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    button { font:inherit; -webkit-tap-highlight-color:transparent; }
    .page { width:min(1180px,calc(100% - 72px)); margin:0 auto; padding:34px 0 24px; }
    header { display:flex; align-items:center; justify-content:space-between; padding-bottom:25px; border-bottom:1px solid #293f3a20; }
    .brand { display:flex; align-items:center; gap:10px; font-size:12px; font-weight:700; letter-spacing:2.2px; }
    .brand svg { width:29px; height:29px; }
    .edition { font-size:10px; letter-spacing:2px; color:var(--muted); }
    .intro { text-align:center; padding:34px 0 24px; }
    .eyebrow { display:flex; justify-content:center; align-items:center; gap:10px; color:#819084; font-size:10px; font-weight:600; letter-spacing:3px; }
    .eyebrow:before,.eyebrow:after { content:""; width:22px; height:1px; background:#abb5a2; }
    h1 { margin:12px 0 10px; font-family:"Songti SC","Noto Serif CJK SC","SimSun",serif; font-size:clamp(30px,4.6vw,52px); font-weight:500; letter-spacing:5px; }
    h1 em { font-style:normal; color:var(--orange); }
    .intro p { margin:0; font-size:12px; letter-spacing:2px; color:var(--muted); }
    .scene { position:relative; overflow:hidden; border:1px solid #dce3cf; border-radius:22px; background:#eaf0df; }
    .landscape { display:block; width:100%; height:auto; }
    .scene-label { position:absolute; z-index:1; top:24px; left:27px; display:flex; align-items:center; gap:8px; font-size:10px; letter-spacing:2px; color:#627f6c; }
    .scene-label:before { content:""; width:5px; height:5px; border-radius:50%; background:#779779; }
    .scene-index { position:absolute; right:25px; bottom:20px; color:#7f8e76; font-size:9px; letter-spacing:2px; }
    .controls { display:flex; align-items:center; justify-content:space-between; padding:20px 3px 0; gap:16px; }
    .caption { font-size:11px; color:#7e897b; letter-spacing:1.5px; }
    .caption span { color:#364d43; margin-right:10px; font-family:Georgia,serif; font-style:italic; font-size:16px; }
    .actions { display:flex; align-items:center; gap:9px; }
    .control { display:inline-flex; justify-content:center; align-items:center; gap:8px; min-height:37px; padding:8px 15px; border:1px solid #cbd3c3; border-radius:30px; background:transparent; color:var(--ink); cursor:pointer; font-size:11px; letter-spacing:1px; transition:background .2s,transform .2s; }
    .control:hover { background:#e7ecdd; transform:translateY(-1px); }
    .control:focus-visible { outline:2px solid #dc7349; outline-offset:4px; }
    .control.primary { background:#304e43; border-color:#304e43; color:#faf8ef; }
    .control.primary:hover { background:#426252; }
    .control svg { width:13px; height:13px; }
    .wind { animation:wind 2.8s ease-in-out infinite; }
    .wind.second { animation-delay:-1.4s; }
    .gull { animation:gull 4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
    .gull.second { animation-delay:-2s; }
    .scarf-tip { animation:scarf .65s ease-in-out infinite alternate; transform-origin:455px 248px; }
    .crest { animation:crest 1.2s ease-in-out infinite alternate; transform-origin:586px 157px; }
    .blink { animation:blink 5.5s infinite; transform-box:fill-box; transform-origin:center; }
    .paused .ambient { animation-play-state:paused !important; }
    @keyframes wind { 0%,100% { opacity:.2; transform:translateX(0); } 50% { opacity:.7; transform:translateX(-14px); } }
    @keyframes gull { 0%,100% { transform:translateY(0) rotate(-3deg); } 50% { transform:translateY(-9px) rotate(3deg); } }
    @keyframes scarf { from { transform:rotate(-4deg); } to { transform:rotate(5deg); } }
    @keyframes crest { from { transform:rotate(-3deg); } to { transform:rotate(3deg); } }
    @keyframes blink { 0%,43%,47%,100% { transform:scaleY(1); } 45% { transform:scaleY(.08); } }
    @media (max-width:640px) {
      .page { width:calc(100% - 28px); padding-top:20px; }
      header { padding-bottom:18px; }
      .edition { font-size:8px; letter-spacing:1px; }
      .brand { font-size:10px; letter-spacing:1.5px; }
      .intro { padding:29px 0 23px; }
      h1 { letter-spacing:3px; }
      .intro p { font-size:10px; letter-spacing:1px; }
      .scene { border-radius:16px; }
      .landscape { width:145%; max-width:none; margin-left:-22.5%; }
      .scene-label { top:15px; left:16px; font-size:8px; letter-spacing:1px; }
      .scene-index { font-size:7px; right:14px; bottom:12px; }
      .controls { flex-wrap:wrap; justify-content:center; padding-top:17px; gap:14px; }
      .caption { width:100%; text-align:center; font-size:10px; }
      .control { min-height:40px; }
    }
    @media (prefers-reduced-motion:reduce) { .ambient { animation:none !important; } .control { transition:none; } }
  </style>
</head>

  <script>
    (() => {
      'use strict';
      const byId = id => document.getElementById(id);
      const parts = Object.fromEntries([
        'rearSpokes', 'frontSpokes', 'pelican', 'nearCrank', 'farCrank',
        'nearLeg', 'nearLegOutline', 'farLeg', 'farLegOutline', 'nearFoot', 'farFoot',
        'roadDashes', 'roadDetails', 'plants', 'clouds', 'water', 'bikeShadow'
      ].map(id => [id, byId(id)]));
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let running = !reducedMotion.matches;
      let fast = false;
      let elapsed = 0;
      let lastTime = null;
      let frameId = null;
      const TAU = Math.PI * 2;

      // A two-segment leg keeps each webbed foot attached to its pedal.
      function poseLeg(side, angle, bounce) {
        const hip = { x:side === 'near' ? 523 : 514, y:334 + bounce };
        const foot = { x:557 + Math.cos(angle) * 44, y:514 + Math.sin(angle) * 44 - 10 };
        const dx = foot.x - hip.x, dy = foot.y - hip.y;
        const length = Math.hypot(dx, dy);
        const half = length / 2;
        const bend = Math.sqrt(Math.max(0, 123 * 123 - half * half));
        const knee = { x:(hip.x + foot.x) / 2 + dy / length * bend,
                       y:(hip.y + foot.y) / 2 - dx / length * bend };
        const d = `M${hip.x} ${hip.y} L${knee.x} ${knee.y} L${foot.x} ${foot.y}`;
        parts[side + 'Leg'].setAttribute('d', d);
        parts[side + 'LegOutline'].setAttribute('d', d);
        parts[side + 'Foot'].setAttribute('transform', `translate(${foot.x} ${foot.y})`);
        parts[side + 'Crank'].setAttribute('d', `M557 514 L${foot.x} ${foot.y + 10}`);
      }

      function draw() {
        const crank = elapsed * TAU / 1.85;
        const wheelAngle = crank * 1.7 * 180 / Math.PI;
        const bounce = Math.sin(crank * 2) * 2;
        const travel = elapsed * (TAU / 1.85) * 1.7 * 99;
        parts.rearSpokes.setAttribute('transform', `rotate(${wheelAngle % 360})`);
        parts.frontSpokes.setAttribute('transform', `rotate(${wheelAngle % 360})`);
        parts.pelican.setAttribute('transform', `translate(0 ${bounce})`);
        poseLeg('far', crank + Math.PI, bounce);
        poseLeg('near', crank, bounce);
        parts.roadDashes.setAttribute('patternTransform', `translate(${-travel % 180} 0)`);
        parts.roadDetails.setAttribute('transform', `translate(${-travel % 1200} 0)`);
        parts.plants.setAttribute('transform', `translate(${-(travel * .64) % 1200} 0)`);
        parts.clouds.setAttribute('transform', `translate(${-(elapsed * 8) % 1200} 0)`);
        parts.water.setAttribute('transform', `translate(${-(elapsed * 12) % 1200} 0)`);
        parts.bikeShadow.setAttribute('rx', 258 + bounce * 1.2);
      }

      function tick(now) {
        if (!running) return;
        if (lastTime !== null) elapsed += Math.min((now - lastTime) / 1000, .05) * (fast ? 1.6 : 1);
        lastTime = now;
        draw();
        frameId = requestAnimationFrame(tick);
      }

      function updatePlayback() {
        byId('scene').classList.toggle('paused', !running);
        byId('playText').textContent = running ? '歇一会儿' : '继续出发';
        byId('playButton').setAttribute('aria-label', running ? '暂停动画' : '播放动画');
        byId('pauseIcon').style.display = running ? '' : 'none';
        byId('playIcon').style.display = running ? 'none' : '';
        if (frameId !== null) cancelAnimationFrame(frameId);
        frameId = null;
        lastTime = null;
        if (running && !document.hidden) frameId = requestAnimationFrame(tick);
      }

      byId('playButton').addEventListener('click', () => { running = !running; updatePlayback(); });
      byId('speedButton').addEventListener('click', () => {
        fast = !fast;
        byId('speedText').textContent = fast ? '轻快骑行' : '悠闲骑行';
        byId('speedButton').setAttribute('aria-label', `切换骑行速度，当前为${fast ? '轻快' : '悠闲'}`);
      });
      document.addEventListener('visibilitychange', updatePlayback);
      reducedMotion.addEventListener('change', event => { running = !event.matches; updatePlayback(); });
      draw();
      updatePlayback();
    })();
  </script>
</body>
</html>
